<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/book.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA：加到主畫面後的啟動體驗（圖示/全螢幕），重點不在離線策略，
         沒有 service worker。manifest 的 background_color/theme_color
         跟 apple-mobile-web-app 這組 meta 都要填 --cream #f6f1e6，
         不是已經併掉的 --color-tour-bg #fdfcfa。 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Marginalia" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 開場動畫「Marginalia」打字字標改跟首頁標題同一套 --font-serif（Fraunces），
         不再需要單獨載入 Cormorant。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300&family=Noto+Serif+TC:wght@400;500;600;700&family=Archivo:wght@400;500;600&family=Gloria+Hallelujah&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Marginalia · 閱讀筆記</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
