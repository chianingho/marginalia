    <path d="M383 124l-7-1.5 6 5" fill="#d8502c"/>
    <circle cx="386.5" cy="130.5" r="1.7" fill="#26332e"/>
    <g stroke="#26332e" stroke-width="1.8" stroke-linecap="round">
      <path d="M390 171v14M390 185l-4 3M390 185l4 3"/>
