<!-- Marginalia App 圖示(2026-07-27 定稿)：粉紅鳥站在闔上的書上。
     鳥的形狀直接沿用 src/components/BirdDoodle.jsx 的路徑資料(全站唯一一份
     鳥插畫資產),只做位移/縮放，沒有重畫。色碼固定寫死 hex（icon 檔案是
     獨立於 app 之外的靜態資產，不在 index.css 的 CSS 變數作用範圍內，
     無法用 var 引用）。四個值分別對應 tokens.css 的 cream、color green、
     pink、red、ink，若這幾個 token 之後改值，這裡要手動同步。
     底色 cream #f6f1e6；書 color green #1e7a6d 實心，書脊線用書架同色系
     的 shelf edge #175e53；鳥身 pink #e9a0b6 不描邊；喙 red #d8502c；
     線稿(眼、腿) ink #26332e。 -->
