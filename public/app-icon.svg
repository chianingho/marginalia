  <rect x="116" y="400" width="280" height="22" rx="4" fill="#1e7a6d"/>
  <line x1="256" y1="400" x2="256" y2="422" stroke="#175e53" stroke-width="2"/>
  <g transform="translate(-1618.4,-502.4) scale(4.8)">
